workflows:
  ios-unsigned:
    name: Build unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate project
        script: xcodegen generate
      - name: Build
        script: |
          xcodebuild -project SpaceXClone.xcodeproj \
            -scheme SpaceXClone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr SpaceXClone.ipa Payload
          ls -lh SpaceXClone.ipa
    artifacts:
      - SpaceXClone.ipa